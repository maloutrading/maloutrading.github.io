name: temperatureStats

on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: temperatureStats

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "xlrd==2.0.1"
      - run: python json/temperatureMarkets/temperature.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/temperatureMarkets/temperature.json
          git diff --cached --quiet || (git commit -m "temperature stats" && (git push || (git pull --rebase origin main && git push)))
