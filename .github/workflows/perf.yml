name: perf

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perf
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "requests<3"
      - run: python perf.py
        env:
          ALPACAAPIKEY: ${{ secrets.ALPACAAPIKEY }}
          ALPACAAPISECRET: ${{ secrets.ALPACAAPISECRET }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add perf.json
          git diff --cached --quiet || (git commit -m "update perf.json" && git push)
