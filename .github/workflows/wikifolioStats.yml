name: wikifolioStats

on:
  schedule:
    - cron: "40 23 * * 0"
  workflow_dispatch:

concurrency:
  group: wikifolioStats

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python websiteData/wikifolio.py
        env:
          WIKIFOLIO_EMAIL: ${{ secrets.WIKIFOLIO_EMAIL }}
          WIKIFOLIO_PASSWORD: ${{ secrets.WIKIFOLIO_PASSWORD }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add websiteData/wikifolio.json websiteData/spx.json
          git diff --cached --quiet || (git commit -m "wikifolio stats" && (git push || (git pull --rebase origin main && git push)))
